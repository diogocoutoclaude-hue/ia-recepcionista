<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dentária Sol Nascente — Recepcionista Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <!-- Demo banner (outside main app) -->
  <div id="demo-banner">
    <span class="demo-badge">DEMONSTRAÇÃO</span>
    <span class="demo-text">Experimente uma recepcionista com IA — marca consultas, responde a perguntas e recolhe contactos</span>
  </div>

  <!-- Unlock overlay -->
  <div id="unlock-overlay" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
    <div class="unlock-content">
      <div class="unlock-icon" aria-hidden="true">🎤</div>
      <h2 id="unlock-title">Bem-vindo à Recepcionista Virtual</h2>
      <p>Clique para começar a conversa</p>
      <button id="unlock-btn" aria-label="Iniciar conversa com a recepcionista virtual">Iniciar Chat</button>
    </div>
  </div>

  <div class="app">

    <!-- Header -->
    <header>
      <div class="avatar">🦷</div>
      <div class="header-text">
        <h1>Clínica Dentária Sol Nascente</h1>
        <p>Recepcionista Virtual</p>
      </div>
      <div class="status-dot" title="Online"></div>
    </header>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="status-text">Pronto — clique no microfone ou escreva abaixo</span>
      <span class="spinner hidden" aria-hidden="true"></span>
    </div>

    <!-- Chat transcript -->
    <div id="chat" role="log" aria-live="polite" aria-label="Conversa"></div>

    <!-- Text input -->
    <div id="text-input-area">
      <input id="text-input" type="text" placeholder="Escreva uma mensagem…" autocomplete="off"
        aria-label="Campo de mensagem" />
      <button id="send-btn" title="Enviar" aria-label="Enviar mensagem">&#9658;</button>
    </div>

    <!-- Voice controls -->
    <div class="controls">
      <button class="btn-icon" id="mute-btn" title="Silenciar / ativar voz" aria-label="Alternar voz">
        🔊
      </button>
      <button id="mic-btn" title="Clique para gravar" aria-label="Começar a gravar">
        🎤
      </button>
      <button class="btn-icon" id="clear-btn" title="Limpar conversa" aria-label="Limpar conversa">
        🗑️
      </button>
    </div>

  </div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="/static/app.js?v=1772483873"></script>
</body>

</html>
